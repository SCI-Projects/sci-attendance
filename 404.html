<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>جاري التوجيه | Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.

      // If the domain is <org>.github.io/<repo-name>, pathSegmentsToKeep is 1.
      // If deployed on a custom domain or user page <org>.github.io, pathSegmentsToKeep is 0.
      var isGithubPagesProject = window.location.hostname.indexOf('github.io') > -1;
      var pathSegmentsToKeep = isGithubPagesProject ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px; background: #0f172a; color: #94a3b8;">
    <p>جاري تحويل المسار، يرجى الانتظار...</p>
    <p>Redirecting to application...</p>
  </body>
</html>
